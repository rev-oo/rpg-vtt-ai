# CI pipeline (specs §6.4). A PR cannot merge unless this is green.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: E2E
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        run: pnpm e2e

  docker:
    name: Docker image
    needs: checks
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile arrives in T-0703; skip the build until it exists.
      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [ -f docker/Dockerfile ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v4
        if: steps.dockerfile.outputs.exists == 'true'

      - uses: docker/build-push-action@v7
        if: steps.dockerfile.outputs.exists == 'true'
        with:
          context: .
          file: docker/Dockerfile
          push: false
