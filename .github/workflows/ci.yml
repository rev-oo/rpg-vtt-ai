# CI pipeline (specs §6.4). A PR cannot merge unless this is green.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        run: pnpm --filter @vtt/e2e exec playwright install --with-deps chromium firefox webkit

      - name: E2E
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        run: pnpm e2e

  # Builds the image from the compose example and checks it like a new operator would
  # (T-0703). Releases publish it (T-0705).
  docker:
    name: Docker image
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and start the compose example
        run: docker compose -f docker/docker-compose.example.yml up -d --build --wait --wait-timeout 120

      - name: Smoke test
        run: docker/smoke-test.sh

      - name: Server logs
        if: failure()
        run: docker compose -f docker/docker-compose.example.yml logs

      - name: Stop
        if: always()
        run: docker compose -f docker/docker-compose.example.yml down --volumes
