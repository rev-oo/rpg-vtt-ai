packages:
  - apps/*
  - packages/*
  - e2e
  # Plugin code with npm dependencies to bundle (T-1604).
  - plugins/dice-3d/code

# Dependency install scripts are denied unless listed as true.
allowBuilds:
  # Ships prebuilt binaries via optional deps; the postinstall is only a fallback.
  unrs-resolver: false
  # Ships its binary via optional platform packages; the postinstall is only a check.
  esbuild: false
